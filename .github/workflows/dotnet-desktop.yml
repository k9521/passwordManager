name: Build and Release Password Manager

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ClickerPassword.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: |
          msbuild ClickerPassword.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:GenerateSerializationAssemblies=Off `
            /m

      - name: Verify application
        shell: pwsh
        run: |
          if (-not (Test-Path "ClickerPassword\bin\Release\PasswordManager.exe")) {
              Write-Error "PasswordManager.exe was not created."
              exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "installer\PasswordManager.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasswordManager-Installer
          path: artifacts/installer/PasswordManager-Setup-*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0.${{ github.run_number }}
          name: Password Manager v1.0.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            artifacts/installer/PasswordManager-Setup-*.exe
